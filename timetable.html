<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Timetable | FUTO IFT</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    :root { --primary:#0b1c3a; --teal:#0d9488; --teal-light:#14b8a6; --bg:#f4f7fb; --panel:rgba(255,255,255,0.96); --line:#e2e8f0; --muted:#64748b; --text:#0f172a; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Inter',system-ui,sans-serif; background: linear-gradient(180deg,#eef6ff 0%, var(--bg) 100%); color:var(--text); }
    a { text-decoration:none; }

    .navbar { position: sticky; top: 0; z-index: 50; background: rgba(11,28,58,0.9); backdrop-filter: blur(12px); border-bottom:1px solid rgba(255,255,255,.08); box-shadow:0 8px 24px rgba(11,28,58,.18); min-height: 68px; display: flex; align-items: center; padding: 12px 18px; gap: 12px; flex-wrap: wrap; }
    .nav-logo { width: 34px; height: 34px; background: linear-gradient(135deg,#0d9488,#14b8a6); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; box-shadow: 0 0 16px rgba(13,148,136,.4); transition: transform .3s; cursor: default; }
    .nav-logo:hover { transform: rotate(10deg) scale(1.05); }
    .nav-title { font-size: 15px; font-weight: 700; color: #fff; letter-spacing: .5px; }
    .nav-links { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-right:auto; }
    .nav-links a { color: rgba(255,255,255,.8); padding:8px 10px; border-radius:9px; transition: all .2s ease; font-size:13px; font-weight:600; text-decoration:none; }
    .nav-links a:hover, .nav-links a.active { background: rgba(20,184,166,.12); color:#fff; box-shadow: inset 0 0 0 1px rgba(20,184,166,.18); }
    .nav-spacer { flex: 1; }
    .nav-welcome { font-size: 12px; color: rgba(255,255,255,.4); }
    .nav-welcome strong { color: #fff; font-weight: 600; }
    .nav-badge { background: rgba(20,184,166,.12); color: #14b8a6; font-size: 11px; font-weight: 600; padding: 4px 12px; border-radius: 20px; font-family: monospace; border: 1px solid rgba(20,184,166,.2); }
    .nav-logout { font-size: 12px; font-weight: 500; color: rgba(255,255,255,.4); cursor: pointer; transition: color .2s; border: none; background: none; display: flex; align-items: center; gap: 5px; }
    .nav-logout:hover { color: #f09595; }

    .page { max-width:1100px; margin:28px auto; padding:0 18px 32px; }
    .panel { background: var(--panel); border:1px solid rgba(148,163,184,.15); box-shadow:0 12px 30px rgba(15,23,42,.06); border-radius:18px; overflow:hidden; }
    .panel-header { padding:22px 24px 12px; border-bottom:1px solid var(--line); background: linear-gradient(180deg, rgba(13,148,136,.04), rgba(255,255,255,0)); }
    .eyebrow { display:inline-flex; align-items:center; gap:8px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color: var(--teal); font-weight:800; }
    .panel-header h1 { margin:10px 0 4px; font-size: clamp(1.7rem, 2vw, 2.1rem); color: var(--primary); }
    .panel-header p { margin:0; color:var(--muted); font-size:14px; }
    .panel-body { padding:20px 24px 24px; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
    .filter { display:inline-flex; align-items:center; gap:10px; background:#f8fafc; border:1px solid var(--line); border-radius:10px; padding:8px 12px; }
    .filter label { font-size:12px; font-weight:700; color:var(--primary); }
    .filter select { border:none; background: transparent; outline:none; color:var(--text); font-weight:600; }
    .schedule { display:flex; flex-direction:column; gap:12px; }
    .schedule-item { display:grid; grid-template-columns: 120px 1fr auto; gap:14px; align-items:center; background:#f8fafc; padding:14px 16px; border:1px solid #edf2f7; border-radius:14px; }
    .pill { display:inline-flex; align-items:center; justify-content:center; min-width:72px; padding:7px 10px; border-radius:999px; font-size:11px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; }
    .pill.class { background: rgba(20,184,166,.12); color: var(--teal); }
    .pill.exam { background: rgba(237, 137, 54, 0.12); color: #c77721; }
    .course { font-size:15px; font-weight:800; color:var(--primary); }
    .meta { font-size:12px; color:var(--muted); margin-top:4px; }
    .empty { padding:18px; color:#64748b; border:1px dashed #cbd5e1; border-radius:12px; background:#f8fafc; }

    @media (max-width: 700px) {
      .schedule-item { grid-template-columns: 1fr; }
      .navbar { padding:10px 14px; }
      .nav-links { width:100%; }
      .panel-header, .panel-body { padding-left:16px; padding-right:16px; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-links">
      <a href="dashboard.html">Home</a>
      <a href="profile.html">Profile</a>
      <a href="course-materials.html">Materials</a>
      <a href="quiz.html">Quiz</a>
      <a href="code-editor.html">Code Lab</a>
      <a href="timetable.html" class="active">Timetable</a>
      <a href="notifications.html">Notifications</a>
      <a href="leaderboard.html">Leaderboard</a>
    </div>
    <div class="nav-spacer"></div>
    <span class="nav-welcome">Welcome, <strong id="navName">Loading...</strong></span>
    <span class="nav-badge" id="navMatric">MAT/XXXX</span>
    <button class="nav-logout" onclick="window.Auth && window.Auth.logout()">
      <i class="fas fa-sign-out-alt"></i> Logout
    </button>
  </nav>

  <main class="page">
    <section class="panel">
      <div class="panel-header">
        <span class="eyebrow"><i class="fa-solid fa-calendar-days"></i> Planning</span>
        <h1>Class & Exam Timetable</h1>
        <p>Filter your schedule by level to see upcoming classes and assessments.</p>
      </div>
      <div class="panel-body">
        <div class="toolbar">
          <div class="filter">
            <label for="levelFilter">Level</label>
            <select id="levelFilter">
              <option value="all">All Levels</option>
              <option value="100">100 Level</option>
              <option value="200">200 Level</option>
              <option value="300">300 Level</option>
              <option value="400">400 Level</option>
              <option value="500">500 Level</option>
            </select>
          </div>
        </div>
        <div id="schedule" class="schedule"></div>
      </div>
    </section>
  </main>

  <script src="api-config.js"></script>
  <script src="auth-utils.js"></script>
  <script>
    var SCHEDULE = [
      { level:'100', type:'Class', course:'IFT 101', when:'Mon 09:00 - 10:30', where:'Room A' },
      { level:'100', type:'Exam', course:'IFT 101', when:'Fri 09:00 - 11:00', where:'Hall B' },
      { level:'200', type:'Class', course:'IFT 201', when:'Tue 11:00 - 12:30', where:'Room C' },
      { level:'200', type:'Exam', course:'IFT 201', when:'Thu 13:00 - 15:00', where:'Hall A' },
      { level:'300', type:'Class', course:'IFT 302', when:'Wed 09:00 - 10:30', where:'Room D' },
      { level:'300', type:'Exam', course:'IFT 302', when:'Fri 09:00 - 11:00', where:'Hall C' },
      { level:'400', type:'Class', course:'IFT 401', when:'Mon 13:00 - 15:00', where:'Room E' },
      { level:'500', type:'Class', course:'IFT 501', when:'Thu 10:00 - 12:00', where:'Room F' }
    ];

    function render(level){
      var list = SCHEDULE.filter(function(s){ return level === 'all' ? true : s.level === level; });
      var el = document.getElementById('schedule');
      el.innerHTML = '';

      if (!list.length) {
        el.innerHTML = '<div class="empty">No schedule found for this level.</div>';
        return;
      }

      list.forEach(function(it){
        var card = document.createElement('div');
        card.className = 'schedule-item';
        card.innerHTML = '<div class="pill ' + (it.type === 'Exam' ? 'exam' : 'class') + '">' + it.type + '</div>' +
          '<div><div class="course">' + it.course + '</div><div class="meta">' + it.when + ' • ' + it.where + '</div></div>' +
          '<div class="meta">Level ' + it.level + '</div>';
        el.appendChild(card);
      });
    }

    document.getElementById('levelFilter').addEventListener('change', function(){ render(this.value); });
    render('all');
  </script>
</body>
</html>
