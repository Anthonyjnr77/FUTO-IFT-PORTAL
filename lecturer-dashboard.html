<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lecturer Dashboard | FUTO IFT</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    :root { --primary:#0b1c3a; --teal:#0d9488; --teal-light:#14b8a6; --bg:#f4f7fb; --panel:rgba(255,255,255,0.96); --line:#e2e8f0; --muted:#64748b; --text:#0f172a; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:'Inter',system-ui,sans-serif; background: linear-gradient(180deg,#eef6ff 0%, var(--bg) 100%); color:var(--text); }
    a { text-decoration:none; }

    .topbar { position: sticky; top:0; z-index:30; background: rgba(11,28,58,0.9); backdrop-filter: blur(12px); border-bottom:1px solid rgba(255,255,255,.08); box-shadow:0 8px 24px rgba(11,28,58,.18); }
    .nav-wrap { max-width:1220px; margin:0 auto; display:flex; align-items:center; gap:12px; padding:12px 18px; min-height:68px; flex-wrap:wrap; }
    .brand { display:inline-flex; align-items:center; gap:10px; padding:8px 10px; background: rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:10px; color:#fff; font-weight:700; margin-right:4px; }
    .brand-mark { width:28px; height:28px; border-radius:8px; background: linear-gradient(135deg, var(--teal), var(--teal-light)); display:flex; align-items:center; justify-content:center; font-size:12px; box-shadow:0 0 16px rgba(20,184,166,.45); }
    .nav-links { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-right:auto; }
    .nav-links a { color: rgba(255,255,255,.8); padding:8px 10px; border-radius:9px; transition: all .2s ease; font-size:13px; font-weight:600; }
    .nav-links a:hover { background: rgba(20,184,166,.12); color:#fff; box-shadow: inset 0 0 0 1px rgba(20,184,166,.18); }
    .nav-cta { color:#fff; border:1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04); padding:8px 12px; border-radius:10px; font-size:12px; font-weight:700; }

    .page { max-width:1100px; margin:28px auto; padding:0 18px 32px; }
    .layout { display:grid; grid-template-columns: 1.2fr .8fr; gap:20px; }
    .panel { background: var(--panel); border:1px solid rgba(148,163,184,.15); box-shadow:0 12px 30px rgba(15,23,42,.06); border-radius:18px; overflow:hidden; }
    .panel-header { padding:18px 20px 10px; border-bottom:1px solid var(--line); background: linear-gradient(180deg, rgba(13,148,136,.04), rgba(255,255,255,0)); }
    .panel-header h2 { margin:8px 0 0; color: var(--primary); }
    .panel-body { padding:18px 20px 20px; }
    .eyebrow { display:inline-flex; align-items:center; gap:8px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color: var(--teal); font-weight:800; }
    .field { width:100%; background:#f8fafc; border:1px solid var(--line); padding:12px 14px; border-radius:12px; font-size:14px; color:var(--text); outline:none; margin-top:12px; }
    .field:focus { border-color: rgba(13,148,136,.5); box-shadow: 0 0 0 4px rgba(13,148,136,.08); }
    textarea.field { min-height: 120px; resize: vertical; }
    .button { display:inline-flex; align-items:center; justify-content:center; background: linear-gradient(135deg, var(--teal), var(--teal-light)); color:#fff; border:none; border-radius:10px; padding:11px 18px; font-weight:700; cursor:pointer; box-shadow: 0 10px 24px rgba(13,148,136,.25); margin-top:12px; }
    .score-list { display:flex; flex-direction:column; gap:12px; }
    .score-item { background:#f8fafc; border:1px solid #edf2f7; border-radius:12px; padding:12px 14px; }
    .score-top { display:flex; justify-content:space-between; gap:10px; font-size:14px; color:var(--primary); }
    .score-top strong { font-weight:700; }
    .score-meta { font-size:11px; color:#94a3b8; margin-top:6px; }
    .empty { padding:16px; color:#64748b; border:1px dashed #cbd5e1; border-radius:12px; background:#f8fafc; }

    @media (max-width: 820px) { .layout { grid-template-columns:1fr; } .nav-wrap { padding:10px 14px; } .nav-links { width:100%; } }
  </style>
</head>
<body>
  <nav class="topbar">
    <div class="nav-wrap">
      <div class="brand"><span class="brand-mark"><i class="fa-solid fa-graduation-cap"></i></span> FUTO IFT</div>
      <div class="nav-links">
        <a href="dashboard.html">Home</a>
        <a href="course-materials.html">Materials</a>
        <a href="quiz.html">Quiz</a>
        <a href="timetable.html">Timetable</a>
        <a href="notifications.html">Notifications</a>
        <a href="leaderboard.html">Leaderboard</a>
      </div>
      <button class="nav-cta" onclick="logout()">Logout</button>
    </div>
  </nav>

  <main class="page">
    <div class="layout">
      <div style="display:flex;flex-direction:column;gap:20px">
        <section class="panel">
          <div class="panel-header">
            <span class="eyebrow"><i class="fa-solid fa-bullhorn"></i> Lecturer</span>
            <h2>Post Announcement</h2>
          </div>
          <div class="panel-body">
            <input id="aTitle" class="field" placeholder="Announcement title" />
            <textarea id="aBody" class="field" placeholder="Message"></textarea>
            <button class="button" onclick="postAnnouncement()">Post Announcement</button>
          </div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <span class="eyebrow"><i class="fa-solid fa-file-pdf"></i> Resources</span>
            <h2>Upload Notes & PDFs</h2>
          </div>
          <div class="panel-body">
            <input id="nTitle" class="field" placeholder="Note title (e.g., IFT 302 - Lecture 5)" />
            <input id="nCourse" class="field" placeholder="Course code (e.g., IFT 302)" style="margin-top:12px" />
            <div style="margin-top:12px">
              <label style="display:block;font-size:12px;font-weight:700;color:var(--primary);margin-bottom:8px">Upload PDF or Note</label>
              <input id="nFile" type="file" accept=".pdf,.doc,.docx,.txt" class="field" style="padding:14px;cursor:pointer" />
              <small style="color:#94a3b8;display:block;margin-top:6px">Supported: PDF, DOC, DOCX, TXT</small>
            </div>
            <button class="button" onclick="postNote()">Upload Note</button>
          </div>
        </section>
      </div>

      <section class="panel">
        <div class="panel-header">
          <span class="eyebrow"><i class="fa-solid fa-chart-simple"></i> Scores</span>
          <h2>Recent Quiz Scores</h2>
        </div>
        <div class="panel-body">
          <div id="scoresList" class="score-list"></div>
        </div>
      </section>
    </div>
  </main>

  <script>
    function logout(){ localStorage.removeItem('futo_lecturer'); window.location.href='index.html'; }

    function postAnnouncement(){
      var t = document.getElementById('aTitle').value.trim();
      var b = document.getElementById('aBody').value.trim();
      if (!t || !b) { alert('Please fill title and message'); return; }

      var key = 'futo_announcements';
      var cur = localStorage.getItem(key);
      var arr = cur ? JSON.parse(cur) : [];
      arr.unshift({ title: t, body: b, date: new Date().toISOString() });
      localStorage.setItem(key, JSON.stringify(arr));

      alert('Announcement posted');
      document.getElementById('aTitle').value = '';
      document.getElementById('aBody').value = '';
    }

    function postNote(){
      var t = document.getElementById('nTitle').value.trim();
      var c = document.getElementById('nCourse').value.trim();
      var f = document.getElementById('nFile').files[0];
      if (!t || !f) { alert('Please fill title and select a file'); return; }

      var reader = new FileReader();
      reader.onload = function(e){
        var key = 'futo_notes';
        var cur = localStorage.getItem(key);
        var arr = cur ? JSON.parse(cur) : [];
        arr.unshift({
          title: t,
          course: c,
          fileName: f.name,
          fileSize: (f.size / 1024).toFixed(2) + ' KB',
          fileData: e.target.result,
          uploadDate: new Date().toISOString()
        });
        localStorage.setItem(key, JSON.stringify(arr));

        alert('Note uploaded successfully');
        document.getElementById('nTitle').value = '';
        document.getElementById('nCourse').value = '';
        document.getElementById('nFile').value = '';
      };
      reader.readAsArrayBuffer(f);
    }

    function renderScores(){
      var rows = localStorage.getItem('futo_quiz_results');
      rows = rows ? JSON.parse(rows) : [];
      var el = document.getElementById('scoresList');
      el.innerHTML = '';

      rows.slice(0, 50).forEach(function(r){
        var d = document.createElement('div');
        d.className = 'score-item';
        d.innerHTML = '<div class="score-top"><strong>' + (r.name || r.matric || 'Anon') + '</strong><span>' + r.score + '%</span></div><div class="score-meta">' + (r.courseCode || '') + ' • ' + new Date(r.date).toLocaleString() + '</div>';
        el.appendChild(d);
      });

      if (!rows.length) el.innerHTML = '<div class="empty">No quiz scores yet.</div>';
    }

    (function(){ if(!localStorage.getItem('futo_lecturer')){ window.location.href='index.html'; } renderScores(); })();
  </script>
</body>
</html>
