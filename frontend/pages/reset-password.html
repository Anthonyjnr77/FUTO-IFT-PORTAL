<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Account Password | LearnIT</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7fb; font-family: Inter, system-ui, sans-serif; color: #0f172a; }
    main { width: min(100% - 32px, 420px); padding: 28px; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 18px 45px rgba(15,23,42,.12); }
    h1 { margin: 0 0 8px; color: #0b1c3a; }
    p { color: #64748b; font-size: 14px; line-height: 1.5; }
    label { display: block; margin: 20px 0 7px; font-size: 12px; font-weight: 700; }
    input, button { width: 100%; padding: 12px; box-sizing: border-box; border-radius: 10px; font: inherit; }
    input { border: 1px solid #cbd5e1; }
    button { margin-top: 20px; border: 0; background: #0d9488; color: #fff; font-weight: 700; cursor: pointer; }
    #message { margin-top: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Reset password</h1>
    <p>Create a new password for your LearnIT account.</p>
    <form id="resetForm">
      <label for="password">New password</label>
      <input id="password" type="password" minlength="6" required autocomplete="new-password">
      <button type="submit">Reset password</button>
    </form>
    <p id="message"></p>
  </main>
  <script src="/assets/js/api-config.js"></script>
  <script src="/assets/js/auth-utils.js"></script>
  <script>
    var token = new URLSearchParams(window.location.search).get('token');
    var form = document.getElementById('resetForm');
    var message = document.getElementById('message');
    form.addEventListener('submit', async function(event) {
      event.preventDefault();
      try {
        var result = await window.Auth.request('/auth/reset-password', {
          method: 'POST',
          body: JSON.stringify({ token: token, password: document.getElementById('password').value })
        });
        message.textContent = result.message + ' You can now log in.';
        form.reset();
      } catch (error) {
        message.textContent = error.message;
      }
    });
  </script>
</body>
</html>
