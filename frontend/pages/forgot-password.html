<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password | LearnIT</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <style>
    :root { --teal:#14b8a6; --teal-dark:#0d9488; --ink:#fff; --muted:rgba(255,255,255,.62); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:#070f1f; color:var(--ink); font-family:Inter,system-ui,sans-serif; }
    .page { width:min(100%, 440px); }
    .brand { text-align:center; margin-bottom:24px; }
    .brand-mark { width:64px; height:64px; display:grid; place-items:center; margin:0 auto 14px; border-radius:18px; background:linear-gradient(135deg,var(--teal-dark),var(--teal)); font-size:26px; box-shadow:0 18px 44px rgba(13,148,136,.34); }
    .brand h1 { margin:0; font-size:22px; letter-spacing:1px; }
    .brand p { margin:7px 0 0; color:var(--muted); font-size:12px; }
    .card { padding:28px; border:1px solid rgba(255,255,255,.12); border-radius:20px; background:rgba(255,255,255,.06); box-shadow:0 28px 70px rgba(0,0,0,.42); backdrop-filter:blur(24px); }
    h2 { margin:0 0 8px; font-size:21px; }
    .intro { margin:0 0 24px; color:var(--muted); font-size:13px; line-height:1.6; }
    label { display:block; margin-bottom:8px; color:rgba(255,255,255,.58); font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; }
    .input-wrap { position:relative; }
    .input-wrap i { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:rgba(255,255,255,.3); }
    input { width:100%; padding:13px 14px 13px 40px; border:1px solid rgba(255,255,255,.12); border-radius:11px; background:rgba(255,255,255,.07); color:#fff; font:inherit; outline:none; }
    input:focus { border-color:rgba(20,184,166,.7); box-shadow:0 0 0 4px rgba(20,184,166,.12); }
    input::placeholder { color:rgba(255,255,255,.28); }
    button { width:100%; margin-top:20px; padding:14px; border:0; border-radius:11px; background:linear-gradient(135deg,var(--teal-dark),var(--teal)); color:#fff; font-weight:800; cursor:pointer; }
    button:disabled { cursor:wait; opacity:.7; }
    .message { display:none; margin-top:16px; padding:12px 14px; border-radius:10px; font-size:12px; line-height:1.5; }
    .message.show { display:block; }
    .message.success { color:#9fe1cb; background:rgba(20,184,166,.12); border:1px solid rgba(20,184,166,.28); }
    .message.error { color:#f5aaaa; background:rgba(226,75,74,.1); border:1px solid rgba(226,75,74,.28); }
    .back { display:block; margin-top:20px; color:var(--teal); font-size:12px; text-align:center; text-decoration:none; }
    .back:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <main class="page">
    <header class="brand">
      <div class="brand-mark">🎓</div>
      <h1>LearnIT</h1>
      <p>Password recovery</p>
    </header>

    <section class="card">
      <h2>Forgot your password?</h2>
      <p class="intro">Enter the email address registered to your student, lecturer, or administrator account. If it is associated with an account, we will send a password reset link.</p>
      <form id="forgotForm">
        <label for="email">Registered email address</label>
        <div class="input-wrap">
          <i class="fas fa-envelope" aria-hidden="true"></i>
          <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <button id="submitButton" type="submit">Send reset link</button>
      </form>
      <div id="message" class="message" role="status" aria-live="polite"></div>
      <a class="back" href="index.html">Back to login</a>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <script src="/assets/js/api-config.js"></script>
  <script src="/assets/js/auth-utils.js"></script>
  <script>
    var form = document.getElementById('forgotForm');
    var emailInput = document.getElementById('email');
    var submitButton = document.getElementById('submitButton');
    var message = document.getElementById('message');
    var requestedEmail = new URLSearchParams(window.location.search).get('email');
    if (requestedEmail) emailInput.value = requestedEmail;

    form.addEventListener('submit', async function(event) {
      event.preventDefault();
      var email = emailInput.value.trim();
      message.className = 'message';
      message.textContent = '';
      submitButton.disabled = true;
      submitButton.textContent = 'Sending...';

      try {
        await window.Auth.request('/auth/forgot-password', {
          method: 'POST',
          body: JSON.stringify({ email: email })
        });
        message.className = 'message success show';
        message.textContent = 'If that email is registered to a LearnIT account, a password reset link has been sent.';
        form.reset();
      } catch (error) {
        message.className = 'message error show';
        message.textContent = error.message;
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Send reset link';
      }
    });
  </script>
</body>
</html>
