<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Notifications | LearnIT</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <style>
    :root { --primary:#0b1c3a; --teal:#0d9488; --teal-light:#14b8a6; --bg:#f4f7fb; --panel:rgba(255,255,255,0.96); --line:#e2e8f0; --muted:#64748b; --text:#0f172a; }
    * { box-sizing: border-box; }
    body {
      margin:0;
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(180deg, #eef6ff 0%, var(--bg) 100%);
      color: var(--text);
    }
    a { text-decoration: none; }

    .navbar { position: sticky; top: 0; z-index: 50; background: rgba(11,28,58,0.9); backdrop-filter: blur(12px); border-bottom:1px solid rgba(255,255,255,.08); box-shadow:0 8px 24px rgba(11,28,58,.18); min-height: 68px; display: flex; align-items: center; padding: 12px 18px; gap: 12px; flex-wrap: wrap; }
    .nav-logo { width: 34px; height: 34px; background: linear-gradient(135deg,#0d9488,#14b8a6); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; box-shadow: 0 0 16px rgba(13,148,136,.4); transition: transform .3s; cursor: default; }
    .nav-logo:hover { transform: rotate(10deg) scale(1.05); }
    .nav-title { font-size: 15px; font-weight: 700; color: #fff; letter-spacing: .5px; }
    .nav-links { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-right:auto; }
    .nav-links a { color: rgba(255,255,255,.8); padding:8px 10px; border-radius:9px; transition: all .2s ease; font-size:13px; font-weight:600; text-decoration:none; }
    .nav-links a:hover, .nav-links a.active { background: rgba(20,184,166,.12); color:#fff; box-shadow: inset 0 0 0 1px rgba(20,184,166,.18); }
    .nav-spacer { flex: 1; }
    .nav-welcome { font-size: 12px; color: rgba(255,255,255,.4); }
    .nav-welcome strong { color: #fff; font-weight: 600; }
    .nav-badge { background: rgba(20,184,166,.12); color: #14b8a6; font-size: 11px; font-weight: 600; padding: 4px 12px; border-radius: 20px; font-family: monospace; border: 1px solid rgba(20,184,166,.2); }
    .nav-logout { font-size: 12px; font-weight: 500; color: rgba(255,255,255,.4); cursor: pointer; transition: color .2s; border: none; background: none; display: flex; align-items: center; gap: 5px; }
    .nav-logout:hover { color: #f09595; }

    .page { max-width: 1100px; margin: 28px auto; padding: 0 18px 32px; }
    .panel { background: var(--panel); border:1px solid rgba(148,163,184,.15); box-shadow:0 12px 30px rgba(15,23,42,.06); border-radius:18px; overflow:hidden; }
    .panel-header { padding:22px 24px 12px; border-bottom:1px solid var(--line); background: linear-gradient(180deg, rgba(13,148,136,.04), rgba(255,255,255,0)); }
    .eyebrow { display:inline-flex; align-items:center; gap:8px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color: var(--teal); font-weight:800; }
    .panel-header h1 { margin: 10px 0 4px; font-size: clamp(1.7rem, 2vw, 2.2rem); color: var(--primary); }
    .panel-header p { margin:0; color:var(--muted); font-size:14px; }
    .panel-body { padding:20px 24px 24px; }
    .notif-list { display:flex; flex-direction:column; gap:12px; }
    .notif-item { display:flex; gap:14px; align-items:flex-start; background:#f8fafc; border:1px solid #edf2f7; border-radius:14px; padding:14px 16px; transition: transform .2s ease, box-shadow .2s ease; }
    .notif-item:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(15,23,42,.05); }
    .notif-icon { flex-shrink:0; width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; background: linear-gradient(135deg, rgba(13,148,136,.12), rgba(20,184,166,.18)); color: var(--teal); }
    .notif-content { flex:1; }
    .notif-title { font-size:15px; font-weight:700; color: var(--primary); margin-bottom:4px; }
    .notif-body { font-size:13px; color: var(--muted); line-height:1.5; }
    .notif-meta { font-size:11px; color:#94a3b8; margin-top:8px; }
    .notif-item.unread { border-left:3px solid var(--teal); }
    .notif-actions { display:flex;align-items:center;gap:12px;margin-top:9px; }
    .notif-link,.read-action { border:0;background:none;padding:0;color:var(--teal);font-size:11px;font-weight:700;text-decoration:none;cursor:pointer; }
    .read-action { color:#64748b; }
    .empty { padding:18px; color:#64748b; border:1px dashed #cbd5e1; border-radius:12px; background:#f8fafc; }

    @media (max-width: 640px) {
      .navbar { padding:10px 14px; }
      .nav-links { width:100%; }
      .panel-header, .panel-body { padding-left:16px; padding-right:16px; }
      .notif-item { padding:12px 13px; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-links">
      <a href="dashboard.html">Home</a>
      <a href="my-courses.html">My Courses</a>
      <a href="profile.html">Profile</a>
      <a href="course-materials.html">Materials</a>
      <a href="quiz.html">Quiz</a>
      <a href="assignments.html">Assignments</a>
      <a href="code-editor.html">Code Lab</a>
      <a href="timetable.html">Timetable</a>
      <a href="notifications.html" class="active">Notifications</a>
      <a href="leaderboard.html">Leaderboard</a>
    </div>
    <div class="nav-spacer"></div>
    <span class="nav-welcome">Welcome, <strong id="navName">Loading...</strong></span>
    <span class="nav-badge" id="navMatric">MAT/XXXX</span>
    <button class="nav-logout" onclick="window.Auth && window.Auth.logout()">
      <i class="fas fa-sign-out-alt"></i> Logout
    </button>
  </nav>

  <main class="page">
    <section class="panel">
      <div class="panel-header">
        <span class="eyebrow"><i class="fa-solid fa-bell"></i> Updates</span>
        <h1>Notifications</h1>
        <p>Announcements, exam reminders and new materials.</p>
      </div>
      <div class="panel-body">
        <div id="notifs" class="notif-list"></div>
      </div>
    </section>
  </main>

  <script src="/assets/js/api-config.js"></script>
  <script src="/assets/js/auth-utils.js"></script>
  <script>
    var currentUser = window.Auth.protect();
    function getAnnouncements(){
      try { var a = localStorage.getItem('futo_announcements'); return a ? JSON.parse(a) : []; } catch(e){ return []; }
    }

    function node(tag, className, text) {
      var element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    async function render(){
      var el = document.getElementById('notifs');
      el.replaceChildren();
      if (!currentUser) return;
      if (currentUser.role === 'lecturer') {
        window.location.href = 'lecturer-dashboard.html';
        return;
      }
      var backendNotifications = [];
      var courseAnnouncements = [];
      try {
        var results = await Promise.all([
          window.Auth.request('/notifications'),
          window.Auth.request('/announcements')
        ]);
        backendNotifications = (results[0].notifications || []).filter(function(item) { return item.type !== 'announcement'; });
        courseAnnouncements = (results[1].announcements || []).map(function(item) {
          return Object.assign({ source: 'content', type: 'announcement', date: item.createdAt }, item);
        });
      } catch (error) {
        el.appendChild(node('div', 'empty', error.message));
        return;
      }
      var localAnnouncements = getAnnouncements().map(function(item) {
        return Object.assign({ source: 'local' }, item);
      });
      var list = backendNotifications.map(function(item) {
        return Object.assign({ source: 'backend' }, item);
      }).concat(courseAnnouncements, localAnnouncements).sort(function(a, b) {
        return new Date(b.createdAt || b.date || 0) - new Date(a.createdAt || a.date || 0);
      });

      if (!list.length) {
        el.appendChild(node('div', 'empty', 'No notifications yet. New assignments and quizzes for your enrolled courses will appear here.'));
        return;
      }

      list.forEach(function(n){
        var card = node('div', 'notif-item' + (n.source === 'backend' && !n.readAt ? ' unread' : ''));
        var iconWrap = node('div', 'notif-icon');
        var icon = document.createElement('i');
        icon.className = 'fa-solid ' + (n.type === 'assignment' ? 'fa-file-pen' : n.type === 'quiz' ? 'fa-circle-question' : n.type === 'material' ? 'fa-file-lines' : 'fa-circle-exclamation');
        iconWrap.appendChild(icon);
        var content = node('div', 'notif-content');
        content.appendChild(node('div', 'notif-title', n.title));
        content.appendChild(node('div', 'notif-body', n.body));
        content.appendChild(node('div', 'notif-meta', new Date(n.createdAt || n.date).toLocaleString()));
        var actions = node('div', 'notif-actions');
        if (n.type === 'assignment' && n.referenceId) {
          var assignmentLink = node('a', 'notif-link', 'View assignment');
          assignmentLink.href = 'assignments.html';
          actions.appendChild(assignmentLink);
        } else if (n.type === 'quiz' && n.referenceId) {
          var quizLink = node('a', 'notif-link', 'View quizzes');
          quizLink.href = 'quiz.html';
          actions.appendChild(quizLink);
        }
        if (n.source === 'backend' && !n.readAt) {
          var readButton = node('button', 'read-action', 'Mark as read');
          readButton.type = 'button';
          readButton.addEventListener('click', async function() {
            readButton.disabled = true;
            try {
              await window.Auth.request('/notifications/' + encodeURIComponent(n.id) + '/read', { method: 'POST', body: JSON.stringify({}) });
              card.classList.remove('unread');
              readButton.remove();
            } catch (error) {
              readButton.disabled = false;
            }
          });
          actions.appendChild(readButton);
        }
        if (actions.childNodes.length) content.appendChild(actions);
        card.append(iconWrap, content);
        el.appendChild(card);
      });
    }

    render();
    window.addEventListener('storage', function(e){ if (e.key === 'futo_announcements') render(); });
  </script>
  <script src="/assets/js/student-chat-widget.js"></script>
</body>
</html>
