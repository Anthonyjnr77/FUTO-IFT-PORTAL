<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leaderboard | FUTO IFT</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <style>
    :root {
      --primary: #0b1c3a;
      --teal: #0d9488;
      --teal-light: #14b8a6;
      --bg: #f4f7fb;
      --panel: rgba(255,255,255,0.96);
      --line: #e2e8f0;
      --muted: #64748b;
      --text: #0f172a;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(180deg, #eef6ff 0%, var(--bg) 100%);
      color: var(--text);
    }

    a { text-decoration: none; }

    .navbar { position: sticky; top: 0; z-index: 50; background: rgba(11,28,58,0.9); backdrop-filter: blur(12px); border-bottom:1px solid rgba(255,255,255,.08); box-shadow:0 8px 24px rgba(11,28,58,.18); min-height: 68px; display: flex; align-items: center; padding: 12px 18px; gap: 12px; flex-wrap: wrap; }
    .nav-logo { width: 34px; height: 34px; background: linear-gradient(135deg,#0d9488,#14b8a6); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; box-shadow: 0 0 16px rgba(13,148,136,.4); transition: transform .3s; cursor: default; }
    .nav-logo:hover { transform: rotate(10deg) scale(1.05); }
    .nav-title { font-size: 15px; font-weight: 700; color: #fff; letter-spacing: .5px; }
    .nav-links { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-right:auto; }
    .nav-links a { color: rgba(255,255,255,.8); padding:8px 10px; border-radius:9px; transition: all .2s ease; font-size:13px; font-weight:600; text-decoration:none; }
    .nav-links a:hover, .nav-links a.active { background: rgba(20,184,166,.12); color:#fff; box-shadow: inset 0 0 0 1px rgba(20,184,166,.18); }
    .nav-spacer { flex: 1; }
    .nav-welcome { font-size: 12px; color: rgba(255,255,255,.4); }
    .nav-welcome strong { color: #fff; font-weight: 600; }
    .nav-badge { background: rgba(20,184,166,.12); color: #14b8a6; font-size: 11px; font-weight: 600; padding: 4px 12px; border-radius: 20px; font-family: monospace; border: 1px solid rgba(20,184,166,.2); }
    .nav-logout { font-size: 12px; font-weight: 500; color: rgba(255,255,255,.4); cursor: pointer; transition: color .2s; border: none; background: none; display: flex; align-items: center; gap: 5px; }
    .nav-logout:hover { color: #f09595; }

    .page {
      max-width: 1100px;
      margin: 28px auto;
      padding: 0 18px 32px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid rgba(148, 163, 184, 0.15);
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
      border-radius: 18px;
      overflow: hidden;
    }

    .panel-header {
      padding: 22px 24px 12px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(13,148,136,0.04), rgba(255,255,255,0));
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--teal);
      font-weight: 800;
    }

    .panel-header h1 {
      margin: 10px 0 4px;
      font-size: clamp(1.7rem, 2vw, 2.2rem);
      color: var(--primary);
    }

    .panel-header p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .panel-body { padding: 20px 24px 24px; }

    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .leader-row {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      align-items: center;
      gap: 14px;
      background: #f8fafc;
      border: 1px solid #edf2f7;
      border-radius: 14px;
      padding: 14px 16px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .leader-row:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.06);
    }

    .rank-badge {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      background: linear-gradient(135deg, rgba(13,148,136,0.1), rgba(20,184,166,0.18));
      color: var(--primary);
      font-size: 15px;
    }

    .leader-name {
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
      font-size: 15px;
    }

    .leader-meta {
      color: var(--muted);
      font-size: 12px;
    }

    .leader-score {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--teal);
      background: rgba(13,148,136,0.06);
      border: 1px solid rgba(13,148,136,0.18);
      border-radius: 999px;
      padding: 7px 12px;
    }

    @media (max-width: 640px) {
      .navbar { padding: 10px 14px; }
      .nav-links { width: 100%; }
      .panel-header, .panel-body { padding-left: 16px; padding-right: 16px; }
      .leader-row { grid-template-columns: 48px 1fr; }
      .leader-score { grid-column: 2; justify-self: start; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-links">
      <a href="dashboard.html">Home</a>
      <a href="my-courses.html">My Courses</a>
      <a href="profile.html">Profile</a>
      <a href="course-materials.html">Materials</a>
      <a href="quiz.html">Quiz</a>
      <a href="assignments.html">Assignments</a>
      <a href="code-editor.html">Code Lab</a>
      <a href="timetable.html">Timetable</a>
      <a href="notifications.html">Notifications</a>
      <a href="leaderboard.html" class="active">Leaderboard</a>
    </div>
    <div class="nav-spacer"></div>
    <span class="nav-welcome">Welcome, <strong id="navName">Loading...</strong></span>
    <span class="nav-badge" id="navMatric">MAT/XXXX</span>
    <button class="nav-logout" onclick="window.Auth && window.Auth.logout()">
      <i class="fas fa-sign-out-alt"></i> Logout
    </button>
  </nav>

  <main class="page">
    <section class="panel">
      <div class="panel-header">
        <span class="eyebrow"><i class="fa-solid fa-trophy"></i> Rankings</span>
        <h1>Leaderboard</h1>
        <p>Top quiz scores across students.</p>
      </div>
      <div class="panel-body">
        <div id="board" class="leaderboard-list"></div>
      </div>
    </section>
  </main>

  <script src="/assets/js/api-config.js"></script>
  <script src="/assets/js/auth-utils.js"></script>
  <script>
    function render(){
      var list = window.Auth ? window.Auth.getLeaderboard(20) : [];
      var el = document.getElementById('board');
      el.innerHTML = '';

      if (!list.length) {
        el.innerHTML = '<div style="padding:18px;color:#64748b;border:1px dashed #cbd5e1;border-radius:12px;background:#f8fafc;">No leaderboard data yet.</div>';
        return;
      }

      list.forEach(function(r, idx){
        var row = document.createElement('div');
        row.className = 'leader-row';
        row.innerHTML = '<div class="rank-badge">#' + (idx + 1) + '</div>' +
          '<div><div class="leader-name">' + (r.name || r.matric || 'Anon') + '</div>' +
          '<div class="leader-meta">' + (r.courseCode || 'General') + ' • ' + (r.level || 'Student') + '</div></div>' +
          '<div class="leader-score">' + r.score + '%</div>';
        el.appendChild(row);
      });
    }

    document.addEventListener('DOMContentLoaded', render);
    window.addEventListener('storage', function(e){ if (e.key === 'futo_quiz_results') render(); });
  </script>
  <script src="/assets/js/student-chat-widget.js"></script>
</body>
</html>
